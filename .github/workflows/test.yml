name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer head on a PR cancels the run on the older head. A push to main has
# its own group (its commit), so a run on main is never cancelled (#283).
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Windows tests run in this many shards, split by position (#187).
  WINDOWS_SHARDS: "6"

jobs:
  pytest:
    name: pytest (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q tests

  # Whether Windows runs. It starts from run. On a pull request it turns
  # Windows off only when the diff is a non-empty list in which every path
  # ends in .md and none is under tests/. An empty diff, a failed diff or a
  # missing base runs Windows. Renames are off, so a script renamed to .md
  # still counts as the script. A push to main always runs.
  scope:
    name: windows scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
      shards: ${{ steps.scope.outputs.shards }}
      count: ${{ steps.scope.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          run=true
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --no-renames --name-only "$BASE...$HEAD" 2>/dev/null)
            code=$?
            if [ "$code" -eq 0 ] && [ -n "$files" ]; then
              text=true
              while IFS= read -r f; do
                case "$f" in
                  tests/*) text=false ;;
                  *.md) ;;
                  *) text=false ;;
                esac
              done <<< "$files"
              [ "$text" = "true" ] && run=false
            fi
            echo "diff exit $code, $(printf '%s\n' "$files" | grep -c .) changed paths"
          fi
          n="$WINDOWS_SHARDS"
          shards=$(seq 0 $((n - 1)) | paste -sd, -)
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "shards=[$shards]" >> "$GITHUB_OUTPUT"
          echo "run=$run count=$n shards=[$shards]"

  # Each shard puts "<digest> <kept> <collected>" in its own output, d<index>.
  # One output per shard index: a change to WINDOWS_SHARDS changes this list
  # too, or pytest (windows) fails on the missing line.
  windows-shard:
    name: pytest (windows shard ${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    outputs:
      d0: ${{ steps.digest.outputs.d0 }}
      d1: ${{ steps.digest.outputs.d1 }}
      d2: ${{ steps.digest.outputs.d2 }}
      d3: ${{ steps.digest.outputs.d3 }}
      d4: ${{ steps.digest.outputs.d4 }}
      d5: ${{ steps.digest.outputs.d5 }}
    env:
      TEST_SHARD_COUNT: ${{ needs.scope.outputs.count }}
      TEST_SHARD_INDEX: ${{ matrix.shard }}
      TEST_SHARD_DIGEST_FILE: shard-digest.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q tests
      - id: digest
        shell: bash
        run: echo "d${TEST_SHARD_INDEX}=$(cat "$TEST_SHARD_DIGEST_FILE")" >> "$GITHUB_OUTPUT"

  # The one name a ruleset would hold. It always runs, and passes in exactly
  # two cases: scope succeeded and said run, and the shards succeeded; or
  # scope succeeded and said skip, and the shards were skipped. Anything else
  # (scope failed or cancelled, a shard failed or cancelled, a mix) fails.
  # In the run case it also fails unless every shard sent its line, all the
  # order digests and collected counts are equal, and the kept counts add up
  # to the collected count: each test ran exactly once.
  windows:
    name: pytest (windows)
    needs: [scope, windows-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          SCOPE: ${{ needs.scope.result }}
          RUN: ${{ needs.scope.outputs.run }}
          COUNT: ${{ needs.scope.outputs.count }}
          SHARDS: ${{ needs.windows-shard.result }}
          D0: ${{ needs.windows-shard.outputs.d0 }}
          D1: ${{ needs.windows-shard.outputs.d1 }}
          D2: ${{ needs.windows-shard.outputs.d2 }}
          D3: ${{ needs.windows-shard.outputs.d3 }}
          D4: ${{ needs.windows-shard.outputs.d4 }}
          D5: ${{ needs.windows-shard.outputs.d5 }}
        run: |
          echo "scope=$SCOPE run=$RUN count=$COUNT shards=$SHARDS"
          fail() { echo "::error::pytest (windows) fails: $1"; exit 1; }
          if [ "$SCOPE" = "success" ] && [ "$RUN" = "false" ] && [ "$SHARDS" = "skipped" ]; then exit 0; fi
          if [ "$SCOPE" != "success" ] || [ "$RUN" != "true" ] || [ "$SHARDS" != "success" ]; then
            fail "scope=$SCOPE run=$RUN shards=$SHARDS"
          fi
          [[ "$COUNT" =~ ^[1-9][0-9]*$ ]] || fail "no shard count"
          first="" total="" sum=0
          for i in $(seq 0 $((COUNT - 1))); do
            name="D$i"; line="${!name}"
            echo "shard $i: ${line:-missing}"
            read -r digest kept collected <<< "$line"
            [[ "$digest" =~ ^[0-9a-f]{12}$ && "$kept" =~ ^[0-9]+$ && "$collected" =~ ^[0-9]+$ ]] \
              || fail "shard $i sent no digest line"
            [ -z "$first" ] && first="$digest" total="$collected"
            [ "$digest" = "$first" ] || fail "shard $i collected a different ordered list"
            [ "$collected" = "$total" ] || fail "shard $i collected $collected, not $total"
            sum=$((sum + kept))
          done
          [ "$sum" = "$total" ] || fail "the shards kept $sum of $total collected"
          echo "every shard collected the same $total tests in order $first; together they ran each once"

  catalog:
    name: CATALOG.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_catalog.py
      - run: git diff --exit-code -- CATALOG.md
