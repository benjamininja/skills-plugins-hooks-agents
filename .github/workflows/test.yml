name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer head on a PR cancels the run on the older head. A push to main has
# its own group (its commit), so a run on main is never cancelled (#283).
concurrency:
  group: test-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A pull request runs Ubuntu only: no PR waits on the Windows run. A
        # push to main runs both systems (#283, Amendment 2).
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pyyaml
      - run: python -m pytest -q tests

  catalog:
    name: CATALOG.md is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/build_catalog.py
      - run: git diff --exit-code -- CATALOG.md
